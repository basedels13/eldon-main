<!DOCTYPE html> 
<html>
<head>
  <title>エルドンオンライン</title>
  <link rel="icon" href="favicon.ico" id="favicon">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width">
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="エルドンオンライン" />
  <meta name="twitter:description" content="エルドンオンライン　ドンジャラ風のボードゲームです。" />
  <meta name="twitter:image" content="https://eldontest.glitch.me/ss5.png" />
  <style>
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
}

#gameRoot{

    position:fixed;

    left:0;
    top:0;

    width:100vw;
    height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    background:#000;
}

canvas{

    image-rendering:auto;
}

.main{
margin: 50px 0 0 0;
  text-align: center;
}
.square{
      margin: 40px 40px 12px 20px;
    padding: 10px;
    background-color:rgba(255,255,255,0.3);
    border: 1px solid #333;
}
.canvas-wrapper{
position: relative;
/* margin: 0 auto; */
overflow: hidden;
padding-top: 75%;
}
.canvas-wrapper canvas{
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  margin: auto;
}
    .article{
   margin: 40px 0 12px 0;
  text-align: start;
}
    .parent{
   margin: auto;
  text-align: center;
}
    .child{
   margin: 640px 0 12px 0;
  text-align: center;
}

    .img-rounded,
    .img-thumbnail {
          margin: 6px;
          }

    .img-rounded {
            -webkit-border-radius: 6px;
            -moz-border-radius: 6px;
            -ms-border-radius: 6px;
            -o-border-radius: 6px;
            border-radius: 6px;
        }
    .img-thumbnail {
        padding: 3px;
        border: #ccd1d9 solid 1px;
        vertical-align: baseline;
        line-height: 1;
        display: -moz-inline-stack;
        display: inline-block;
        vertical-align: middle;
        vertical-align: auto;
        zoom: 1;
        display: inline;
        -webkit-border-radius: 6px;
        -moz-border-radius: 6px;
        -ms-border-radius: 6px;
        -o-border-radius: 6px;
        border-radius: 6px;
        }

</style>
</head>
<body>
<div class="canvas-wrapper">
<div id="gameRoot">
    <canvas id="canvas"></canvas>
    <div id="mobileButtons">
        MENU
    </div>
</div>
</div>
</body>
<script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.1.3/howler.min.js"></script>
<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js" integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+" crossorigin="anonymous"></script>
<script src="script/howler.js"></script>
<script src="script/createjs.min.js"></script>
<script src="script/data.js"></script>
<script src="script/donsword0.78.js"></script>
</html>
